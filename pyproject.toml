[project]
name = "upgrade-impact"
version = "0.1.0.dev0"
description = "Tell whether a Dependabot or Renovate bump touches your code, where, and why, with every claim cited to a release-note line and a code line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeeshan Imdad" }]
requires-python = ">=3.11"
keywords = ["dependabot", "renovate", "dependencies", "upgrade", "breaking-changes", "llm", "mcp", "devtools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Software Distribution",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "packaging>=23",
  "pydantic>=2.7,<3",
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
# OpenTelemetry traces and metrics (UPGRADE_IMPACT_OTEL=1); see upgrade_impact.telemetry.
otel = [
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.urls]
Homepage = "https://github.com/xeeshan16/upgrade-impact"
Issues = "https://github.com/xeeshan16/upgrade-impact/issues"
Changelog = "https://github.com/xeeshan16/upgrade-impact/blob/main/CHANGELOG.md"

[project.scripts]
upgrade-impact = "upgrade_impact.cli:main"

[dependency-groups]
dev = [
  "mcp>=1.9",
  "mypy>=1.11",
  # So the telemetry path is type-checked and tested; shipped only via the otel extra.
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upgrade_impact"]

[tool.hatch.build.targets.sdist]
include = ["src/upgrade_impact", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "PL"]
ignore = [
  "PLR0913", # explicit keyword arguments are clearer than option bags here
  "PLR2004", # small literal thresholds are documented inline
  "PLR0911", # early returns read better than nested conditions in matchers
  "S101",    # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415"]
"src/upgrade_impact/telemetry.py" = ["PLC0415"]  # the optional OpenTelemetry extra is imported lazily
"tests/test_bump.py" = ["S", "PLR", "PLC0415", "E501"]  # a real Renovate table row

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "build", "dist"]
markers = [
  "live: talks to a real external service (skipped unless the matching env var is set)",
]

[tool.coverage.run]
source = ["upgrade_impact"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
