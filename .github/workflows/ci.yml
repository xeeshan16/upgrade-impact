name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: unit and integration tests with coverage
        env:
          # Live tests read PyPI, raw changelogs and a real Dependabot PR via the GitHub API.
          UPGRADE_IMPACT_LIVE: ${{ matrix.python == '3.12' && '1' || '' }}
          UPGRADE_IMPACT_LIVE_GITHUB: ${{ matrix.python == '3.12' && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          uv run pytest --cov --cov-report=term --cov-report=xml:reports/coverage.xml
          --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python }}
          path: reports/

  eval:
    name: eval (dev split, fake provider) and gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: restore clones and release notes
        uses: actions/cache@v4
        with:
          path: ~/.cache/upgrade-impact
          # One cache per dataset version: the release notes fetched on the first run
          # are reused, so later runs score the same notes.
          key: eval-${{ hashFiles('data/cases.jsonl') }}
      - name: deterministic systems and the fake provider on the dev split
        env:
          # Release notes come from the GitHub Releases API (and CHANGELOG files).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run upgrade-impact eval data/cases.jsonl --split dev --provider fake \
            --out reports/eval-dev --gate data/gate.json
          cat reports/eval-dev/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-dev
          path: reports/

  action:
    name: the GitHub Action on a real Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: https://github.com/uriyyo/fastapi-pagination/pull/1373
      # The Dependabot commit, before the maintainer fixed the removed app= argument.
      BUMP_SHA: e14c865aebed311824f192cefe16e9e64a9ade19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run the action (fake provider)
        id: impact
        uses: ./
        with:
          pr-url: ${{ env.PR }}
          ref: ${{ env.BUMP_SHA }}
          provider: fake
      - name: check its outputs
        env:
          VERDICT: ${{ steps.impact.outputs.verdict }}
          REPORT: ${{ steps.impact.outputs.report-json }}
          PACKAGES: ${{ steps.impact.outputs.packages }}
        run: |
          echo "verdict=$VERDICT packages=$PACKAGES report=$REPORT"
          case "$VERDICT" in affected|review) ;; *) exit 1 ;; esac
          test "$PACKAGES" = 1
          python3 - "$REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["verdict"] in ("affected", "review"), report["verdict"]
          hits = {
              (m["usage"]["path"], m["usage"]["line"])
              for b in report["bumps"] for r in b["results"]
              if r["status"] in ("affected", "possible") for m in r["matches"]
          }
          assert ("tests/conftest.py", 271) in hits, sorted(hits)
          print("ok")
          PY
      - name: fail-on review fails the step
        id: gate
        continue-on-error: true
        uses: ./
        with:
          pr-url: ${{ env.PR }}
          ref: ${{ env.BUMP_SHA }}
          provider: fake
          fail-on: review
          annotate: "false"
      - name: no model configured runs without one
        id: nollm
        uses: ./
        with:
          pr-url: ${{ env.PR }}
          ref: ${{ env.BUMP_SHA }}
          annotate: "false"
      - name: check the gate and the no-model run
        env:
          GATE: ${{ steps.gate.outcome }}
          NOLLM: ${{ steps.nollm.outputs.verdict }}
        run: |
          echo "gate=$GATE no-model verdict=$NOLLM"
          test "$GATE" = failure
          case "$NOLLM" in affected|review|no-impact|unknown) ;; *) exit 1 ;; esac

  package:
    name: build, install, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: install the wheel into a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/upgrade-impact --version
      - name: installed MCP server answers the handshake and lists its tools
        run: |
          mkdir -p reports
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | /tmp/clean/bin/upgrade-impact mcp --no-llm > reports/mcp-smoke.jsonl
          cat reports/mcp-smoke.jsonl
          python3 - <<'PY'
          import json
          replies = [json.loads(line) for line in open("reports/mcp-smoke.jsonl")]
          tools = {t["name"] for t in replies[1]["result"]["tools"]}
          assert tools == {"assess_bump", "find_usages", "get_release_notes"}, tools
          PY
      - name: installed eval runs on two dataset cases (no model)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          /tmp/clean/bin/upgrade-impact eval data/cases.jsonl --split dev --per-label 1 \
            --no-llm --systems import-grep,symbol-grep --bootstrap 50 --out reports/eval-smoke
      - name: check a real Dependabot PR (fake provider, real notes and code)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPGRADE_IMPACT_CACHE_DIR: /tmp/upgrade-impact-cache
        run: |
          mkdir -p reports
          # uriyyo/fastapi-pagination#1373 bumped httpx 0.27.2 -> 0.28.0; e14c865 is the
          # Dependabot commit, before the maintainer pushed a fix for the removed app= argument.
          /tmp/clean/bin/upgrade-impact check https://github.com/uriyyo/fastapi-pagination/pull/1373 \
            --ref e14c865aebed311824f192cefe16e9e64a9ade19 --provider fake --format json \
            -o reports/smoke.json
          python3 - <<'PY'
          import json
          report = json.load(open("reports/smoke.json"))
          [bump] = report["bumps"]
          assert bump["bump"]["package"] == "httpx", bump["bump"]
          assert "0.28.0" in bump["notes_versions"], bump["notes_versions"]
          # The notes say "the deprecated `app` argument has now been removed" without
          # naming the API, so without adjudication the call is a "possible" match.
          hits = [
              (m["usage"]["path"], m["usage"]["line"])
              for r in bump["results"] if r["status"] in ("affected", "possible")
              for m in r["matches"] if m["strength"] in ("direct", "symbol")
          ]
          assert ("tests/conftest.py", 271) in hits, hits
          print("ok:", hits)
          PY
          /tmp/clean/bin/upgrade-impact check https://github.com/uriyyo/fastapi-pagination/pull/1373 \
            --ref e14c865aebed311824f192cefe16e9e64a9ade19 --provider fake --format markdown \
            >> "$GITHUB_STEP_SUMMARY"
      - name: demo PRs report (fake provider)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/demo_report.py --provider fake --out reports/demo-fake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-and-smoke
          path: |
            dist/
            reports/
