name: real-model

# Runs upgrade-impact on real Dependabot PRs with a real local model (Ollama on
# the runner's CPU). Its reports are the source of the sample output in the
# README. Not a required check: model downloads and CPU inference are slow.

on:
  workflow_dispatch:
    inputs:
      models:
        description: Ollama models (JSON list)
        default: '["qwen2.5:3b", "qwen2.5:7b"]'
      eval_per_label:
        description: Also run the eval on N impact + N no-impact cases (0 = skip)
        default: "0"
      eval_split:
        description: Dataset split for the eval (dev while developing; test is held out)
        type: choice
        options: [dev, test]
        default: dev
      eval_model:
        description: Ollama model for the eval
        default: qwen2.5:7b
      demo:
        description: Run the demo PRs
        type: boolean
        default: true
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: real-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ollama:
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.demo) ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["qwen2.5:3b", "qwen2.5:7b"]') }}
    env:
      MODEL: ${{ matrix.model }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPGRADE_IMPACT_PROVIDER: ollama
      UPGRADE_IMPACT_TIMEOUT_S: "1200"
      UPGRADE_IMPACT_MAX_RETRIES: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/api/tags > /dev/null; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama --version
      - run: ollama pull "$MODEL"
      - name: real demo PRs
        run: |
          uv run python -u scripts/demo_report.py --model "$MODEL" --out "reports/${MODEL//:/-}"
          cat "reports/${MODEL//:/-}/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the GitHub Action with the real model
        id: action
        uses: ./
        with:
          pr-url: https://github.com/uriyyo/fastapi-pagination/pull/1373
          ref: e14c865aebed311824f192cefe16e9e64a9ade19
          provider: ollama
          model: ${{ matrix.model }}
      - name: action outputs
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          LINES: ${{ steps.action.outputs.affected-lines }}
          REPORT: ${{ steps.action.outputs.report-json }}
        run: |
          echo "verdict=$VERDICT affected-lines=$LINES"
          mkdir -p reports/action
          cp "$REPORT" "reports/action/${MODEL//:/-}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-${{ strategy.job-index }}
          path: reports/

  eval:
    # Real-model eval on a fixed sample of one split. Slow on a CPU runner, so manual only.
    if: github.event_name == 'workflow_dispatch' && inputs.eval_per_label != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPGRADE_IMPACT_PROVIDER: ollama
      UPGRADE_IMPACT_TIMEOUT_S: "1200"
      UPGRADE_IMPACT_MAX_RETRIES: "1"
      # Fewer review calls per bump keeps one case under ~15 minutes on CPU.
      UPGRADE_IMPACT_MAX_REVIEW_CALLS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: restore clones, notes and model replies
        uses: actions/cache@v4
        with:
          path: ~/.cache/upgrade-impact
          key: real-eval-${{ inputs.eval_model }}-${{ github.run_id }}
          restore-keys: real-eval-${{ inputs.eval_model }}-
      - name: install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/api/tags > /dev/null; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
      - run: ollama pull "${{ inputs.eval_model }}"
      - name: eval on a fixed sample of the chosen split
        env:
          SPLIT: ${{ inputs.eval_split }}
        run: |
          uv run upgrade-impact eval data/cases.jsonl --split "$SPLIT" \
            --per-label "${{ inputs.eval_per_label }}" --model "${{ inputs.eval_model }}" \
            --out reports/eval-real
          cat reports/eval-real/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-real-${{ inputs.eval_split }}
          path: reports/
